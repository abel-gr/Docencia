    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .step-container {
            border: 2px dashed #e5e7eb;
            transition: all 0.3s ease;
        }
        .step-container.active {
            border-color: #3b82f6;
            background-color: #f8fafc;
        }
        .image-display {
            max-width: 100%;
            max-height: 400px;
            object-fit: contain;
        }
    </style>

<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen p-6">
    <div class="max-w-4xl mx-auto">
        <header class="text-center mb-8">
            <h1 class="text-4xl font-bold text-indigo-800 mb-2">Eina de Visió per Computador</h1>
            <p class="text-lg text-gray-600">Aplica tècniques de processament d'imatges pas a pas</p>
        </header>

        <div id="stepsContainer" class="space-y-6">
            <!-- Initial upload step -->
            <div class="step-container active bg-white rounded-lg p-6 shadow-lg">
                <h2 class="text-2xl font-semibold text-gray-800 mb-4">Pas 1: Carrega la teva imatge</h2>
                <div class="space-y-4">
                    <input type="file" id="imageUpload" accept="image/*" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
                    <div id="imageContainer" class="border-2 border-dashed border-gray-300 rounded-lg p-8 text-center min-h-[200px] flex items-center justify-center">
                        <p class="text-gray-500">Selecciona una imatge per començar</p>
                    </div>
                </div>
                <button id="addFirstStep" class="mt-4 bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2 rounded-lg font-medium transition-colors disabled:opacity-50 disabled:cursor-not-allowed" disabled="">
                    Afegir Pas de Processament
                </button>
            </div>
        </div>
    </div>

    <script>
        let stepCounter = 1;
        let currentImage = null;
        let processedImages = [];

        const imageUpload = document.getElementById('imageUpload');
        const imageContainer = document.getElementById('imageContainer');
        const addFirstStep = document.getElementById('addFirstStep');
        const stepsContainer = document.getElementById('stepsContainer');

        // Handle image upload
        imageUpload.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    currentImage = e.target.result;
                    processedImages = [currentImage];
                    displayImage(imageContainer, currentImage);
                    addFirstStep.disabled = false;
                };
                reader.readAsDataURL(file);
            }
        });

        function displayImage(container, imageSrc) {
            container.innerHTML = `<img src="${imageSrc}" class="image-display mx-auto rounded-lg shadow-md" alt="Imatge processada">`;
        }

        // Add first processing step
        addFirstStep.addEventListener('click', function() {
            addProcessingStep();
        });

        function addProcessingStep() {
            const stepDiv = document.createElement('div');
            stepDiv.className = 'step-container bg-white rounded-lg p-6 shadow-lg';
            stepDiv.innerHTML = `
                <h2 class="text-2xl font-semibold text-gray-800 mb-4">Pas X: Processament d'Imatge</h2>
                
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Selecciona la tècnica:</label>
                    <select class="technique-select w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                        <option value="">Selecciona una tècnica...</option>
                        <option value="colorReplace">Canviar Color RGB</option>
                        <option value="grayscale">Transformar a Escala de Grisos</option>
                        <option value="threshold">Binarització per Llindar</option>
                        <option value="niblack">Binarització de Niblack</option>
                        <option value="dilate">Operació Morfològica: Dilatació</option>
                        <option value="erode">Operació Morfològica: Erosió</option>
                        <option value="opening">Operació Morfològica: Obertura</option>
                        <option value="closing">Operació Morfològica: Tancament</option>
                        <option value="morphGradient">Morphological Gradient</option>
                        <option value="imageSum">Suma d'Imatges</option>
                        <option value="imageDiff">Diferència d'Imatges</option>
                        <option value="crop">Retallar Imatge</option>
                        <option value="showValues">Mostrar Valors de Color</option>
                        <option value="labeling">Etiquetatge de Regions</option>
                    </select>
                </div>

                <div class="parameters-container mb-4"></div>

                <button class="run-method bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded-lg font-medium transition-colors disabled:opacity-50 disabled:cursor-not-allowed mb-4" disabled>
                    Executar Mètode
                </button>

                <div class="result-container border-2 border-dashed border-gray-300 rounded-lg p-8 text-center min-h-[200px] flex items-center justify-center mb-4">
                    <p class="text-gray-500">El resultat apareixerà aquí després d'executar el mètode</p>
                </div>

                <div class="flex flex-wrap gap-2">
                    <button class="add-step bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg font-medium transition-colors" style="display: none;">
                        Afegir Pas
                    </button>
                    <button class="delete-step bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg font-medium transition-colors">
                        Eliminar Pas
                    </button>
                    <button class="move-up bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded-lg font-medium transition-colors">
                        ↑ Pujar
                    </button>
                    <button class="move-down bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded-lg font-medium transition-colors">
                        ↓ Baixar
                    </button>
                </div>
            `;

            stepsContainer.appendChild(stepDiv);

            // Add event listeners for this step
            setupStepEventListeners(stepDiv);
            
            // Renumber all steps
            renumberSteps();
        }

        function renumberSteps() {
            const steps = Array.from(stepsContainer.children);
            steps.forEach((step, index) => {
                if (index === 0) return; // Skip the original image step
                
                const header = step.querySelector('h2');
                if (header) {
                    header.textContent = `Pas ${index + 1}: Processament d'Imatge`;
                }
                
                // Update button visibility
                const moveUpButton = step.querySelector('.move-up');
                const moveDownButton = step.querySelector('.move-down');
                
                if (moveUpButton) {
                    moveUpButton.style.display = index === 1 ? 'none' : 'inline-block';
                }
                if (moveDownButton) {
                    moveDownButton.style.display = index === steps.length - 1 ? 'none' : 'inline-block';
                }
            });
        }

        function setupStepEventListeners(stepDiv) {
            const techniqueSelect = stepDiv.querySelector('.technique-select');
            const parametersContainer = stepDiv.querySelector('.parameters-container');
            const runButton = stepDiv.querySelector('.run-method');
            const resultContainer = stepDiv.querySelector('.result-container');
            const addStepButton = stepDiv.querySelector('.add-step');

            techniqueSelect.addEventListener('change', function() {
                const technique = this.value;
                parametersContainer.innerHTML = '';
                runButton.disabled = !technique;

                if (technique) {
                    generateParameterInputs(technique, parametersContainer);
                }
            });

            runButton.addEventListener('click', function() {
                const technique = techniqueSelect.value;
                const parameters = getParameterValues(parametersContainer);
                
                // Get the correct input image for this step
                const stepIndex = getStepIndex(stepDiv);
                const inputImageIndex = stepIndex - 1; // Previous step's result
                const inputImage = processedImages[inputImageIndex] || currentImage;
                
                // Check image size for showValues operation
                if (technique === 'showValues') {
                    checkImageSizeForShowValues(inputImage, function(isValid) {
                        if (isValid) {
                            simulateProcessing(technique, parameters, resultContainer, addStepButton, inputImage, stepIndex);
                        } else {
                            resultContainer.innerHTML = '<p class="text-red-600">La imatge és massa gran per mostrar valors (màxim 20x20 píxels)</p>';
                        }
                    });
                } else {
                    // Simulate processing (in a real app, this would call actual CV functions)
                    simulateProcessing(technique, parameters, resultContainer, addStepButton, inputImage, stepIndex);
                }
            });

            addStepButton.addEventListener('click', function() {
                addProcessingStep();
            });

            // Delete step
            const deleteButton = stepDiv.querySelector('.delete-step');
            deleteButton.addEventListener('click', function() {
                const stepIndex = getStepIndex(stepDiv);
                stepDiv.remove();
                renumberSteps();
                reprocessFromStep(stepIndex);
            });

            // Move step up
            const moveUpButton = stepDiv.querySelector('.move-up');
            moveUpButton.addEventListener('click', function() {
                const prevStep = stepDiv.previousElementSibling;
                if (prevStep && !prevStep.querySelector('#imageUpload')) {
                    const originalIndex = getStepIndex(stepDiv);
                    stepDiv.parentNode.insertBefore(stepDiv, prevStep);
                    renumberSteps();
                    // Reprocess from the new position of the moved step
                    reprocessFromStep(getStepIndex(stepDiv));
                }
            });

            // Move step down
            const moveDownButton = stepDiv.querySelector('.move-down');
            moveDownButton.addEventListener('click', function() {
                const nextStep = stepDiv.nextElementSibling;
                if (nextStep) {
                    const originalIndex = getStepIndex(stepDiv);
                    stepDiv.parentNode.insertBefore(nextStep, stepDiv);
                    renumberSteps();
                    // Reprocess from the original position (now the previous step)
                    reprocessFromStep(originalIndex);
                }
            });
        }

        function generateParameterInputs(technique, container) {
            let html = '';
            
            switch(technique) {
                case 'colorReplace':
                    html = `
                        <div class="bg-blue-50 p-4 rounded-lg mb-4">
                            <p class="text-sm text-gray-700">
                                <strong>Mètode:</strong> Substitució de color RGB amb tolerància<br>
                                <em>Si |R-Rorig| ≤ tol AND |G-Gorig| ≤ tol AND |B-Borig| ≤ tol → nou color</em>
                            </p>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div class="space-y-3">
                                <h4 class="font-medium text-gray-700">Color Original (RGB):</h4>
                                <div class="grid grid-cols-3 gap-2">
                                    <div>
                                        <label class="block text-xs text-gray-600">R (0-255):</label>
                                        <input type="number" name="origR" min="0" max="255" value="255" class="w-full p-2 border border-gray-300 rounded">
                                    </div>
                                    <div>
                                        <label class="block text-xs text-gray-600">G (0-255):</label>
                                        <input type="number" name="origG" min="0" max="255" value="0" class="w-full p-2 border border-gray-300 rounded">
                                    </div>
                                    <div>
                                        <label class="block text-xs text-gray-600">B (0-255):</label>
                                        <input type="number" name="origB" min="0" max="255" value="0" class="w-full p-2 border border-gray-300 rounded">
                                    </div>
                                </div>
                            </div>
                            <div class="space-y-3">
                                <h4 class="font-medium text-gray-700">Nou Color (RGB):</h4>
                                <div class="grid grid-cols-3 gap-2">
                                    <div>
                                        <label class="block text-xs text-gray-600">R (0-255):</label>
                                        <input type="number" name="newR" min="0" max="255" value="0" class="w-full p-2 border border-gray-300 rounded">
                                    </div>
                                    <div>
                                        <label class="block text-xs text-gray-600">G (0-255):</label>
                                        <input type="number" name="newG" min="0" max="255" value="255" class="w-full p-2 border border-gray-300 rounded">
                                    </div>
                                    <div>
                                        <label class="block text-xs text-gray-600">B (0-255):</label>
                                        <input type="number" name="newB" min="0" max="255" value="0" class="w-full p-2 border border-gray-300 rounded">
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="mt-3">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Tolerància (0-50):</label>
                            <input type="number" name="tolerance" min="0" max="50" value="10" class="w-full p-2 border border-gray-300 rounded-lg">
                        </div>
                    `;
                    break;
                case 'grayscale':
                    html = `
                        <div class="bg-blue-50 p-4 rounded-lg">
                            <p class="text-sm text-gray-700">
                                <strong>Mètode:</strong> Mitjana dels tres canals RGB<br>
                                <em>Gris = (R + G + B) / 3</em>
                            </p>
                        </div>
                    `;
                    break;
                case 'threshold':
                    html = `
                        <div class="bg-blue-50 p-4 rounded-lg mb-4">
                            <p class="text-sm text-gray-700">
                                <strong>Mètode:</strong> Binarització per llindar global<br>
                                <em>Binari: Si píxel ≥ llindar → 255 (blanc), sinó → 0 (negre)</em><br>
                                <em>Binari Invers: Si píxel < llindar → 255 (blanc), sinó → 0 (negre)</em>
                            </p>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Valor del Llindar (0-255):</label>
                                <input type="number" name="threshold" min="0" max="255" value="128" class="w-full p-2 border border-gray-300 rounded-lg">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Tipus:</label>
                                <select name="type" class="w-full p-2 border border-gray-300 rounded-lg">
                                    <option value="binary">Binari</option>
                                    <option value="binary_inv">Binari Invers</option>
                                </select>
                            </div>
                        </div>
                    `;
                    break;

        function isGrayscaleImage(imageData) {
            const data = imageData.data;
            for (let i = 0; i < data.length; i += 4) {
                const r = data[i];
                const g = data[i + 1];
                const b = data[i + 2];
                
                // Check if R, G, B values are the same (grayscale)
                if (r !== g || g !== b) {
                    return false;
                }
            }
            return true;
        }

        function isBinaryImage(imageData) {
            const data = imageData.data;
            for (let i = 0; i < data.length; i += 4) {
                const r = data[i];
                const g = data[i + 1];
                const b = data[i + 2];
                
                // Check if pixel is not pure black (0,0,0) or pure white (255,255,255)
                if (!((r === 0 && g === 0 && b === 0) || (r === 255 && g === 255 && b === 255))) {
                    return false;
                }
            }
            return true;
        }

        function simulateProcessing(technique, parameters, resultContainer, addStepButton, inputImage, stepIndex) {
            // Show loading state
            resultContainer.innerHTML = `
                <div class="flex items-center justify-center">
                    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-indigo-600"></div>
                    <span class="ml-2 text-gray-600">Processant...</span>

            `;

            // Simulate processing delay
            setTimeout(() => {

        function processImageWithCanvas(imageSrc, technique, parameters, resultContainer, addStepButton, stepIndex) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                canvas.width = img.width;
                canvas.height = img.height;
                
                ctx.drawImage(img, 0, 0);
                
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = imageData.data;
                
                let description = '';
                let regionCount = 0;
                
                switch(technique) {
                    case 'colorReplace':
                        // Color replacement
                        const origR = parseInt(parameters.origR);
                        const origG = parseInt(parameters.origG);
                        const origB = parseInt(parameters.origB);
                        const newR = parseInt(parameters.newR);
                        const newG = parseInt(parameters.newG);
                        const newB = parseInt(parameters.newB);
                        const tolerance = parseInt(parameters.tolerance);
                        
                        for (let i = 0; i < data.length; i += 4) {
                            const r = data[i];
                            const g = data[i + 1];
                            const b = data[i + 2];
                            
                            if (Math.abs(r - origR) <= tolerance && 
                                Math.abs(g - origG) <= tolerance && 
                                Math.abs(b - origB) <= tolerance) {
                                data[i] = newR;
                                data[i + 1] = newG;
                                data[i + 2] = newB;
                            }
                        }
                        description = `Substitució de color RGB(${origR},${origG},${origB}) per RGB(${newR},${newG},${newB}) amb tolerància ${tolerance}`;
                        break;
                        
                    case 'grayscale':
                        // Convert to grayscale using average method
                        for (let i = 0; i < data.length; i += 4) {
                            const gray = Math.round((data[i] + data[i + 1] + data[i + 2]) / 3);
                            data[i] = gray;     // Red
                            data[i + 1] = gray; // Green
                            data[i + 2] = gray; // Blue
                        }
                        description = 'Transformació a escala de grisos mitjançant la mitjana RGB';
                        break;
                        
                    case 'threshold':
                        // First convert to grayscale, then apply threshold
                        const threshold = parseInt(parameters.threshold);
                        const isInverse = parameters.type === 'binary_inv';
                        
                        for (let i = 0; i < data.length; i += 4) {
                            const gray = Math.round((data[i] + data[i + 1] + data[i + 2]) / 3);
                            let binaryValue;
                            
                            if (isInverse) {
                                binaryValue = gray < threshold ? 255 : 0;
                            } else {
                                binaryValue = gray >= threshold ? 255 : 0;
                            }
                            
                            data[i] = binaryValue;     // Red
                            data[i + 1] = binaryValue; // Green
                            data[i + 2] = binaryValue; // Blue
                        }
                        description = `Binarització ${isInverse ? 'inversa' : ''} amb llindar ${threshold}`;
                        break;
                        
                    case 'niblack':
                        // Simplified Niblack implementation
                        const windowSize = parseInt(parameters.windowSize);
                        const k = parseFloat(parameters.k);
                        const halfWindow = Math.floor(windowSize / 2);
                        
                        // First convert to grayscale
                        const grayData = new Uint8Array(canvas.width * canvas.height);
                        for (let i = 0; i < data.length; i += 4) {
                            grayData[i / 4] = Math.round((data[i] + data[i + 1] + data[i + 2]) / 3);
                        }
                        
                        // Apply Niblack thresholding
                        for (let y = 0; y < canvas.height; y++) {
                            for (let x = 0; x < canvas.width; x++) {
                                const idx = y * canvas.width + x;
                                
                                // Calculate local mean and standard deviation
                                let sum = 0;
                                let sumSq = 0;
                                let count = 0;
                                
                                for (let dy = -halfWindow; dy <= halfWindow; dy++) {
                                    for (let dx = -halfWindow; dx <= halfWindow; dx++) {
                                        const ny = y + dy;
                                        const nx = x + dx;
                                        
                                        if (ny >= 0 && ny < canvas.height && nx >= 0 && nx < canvas.width) {
                                            const val = grayData[ny * canvas.width + nx];
                                            sum += val;
                                            sumSq += val * val;
                                            count++;
                                        }
                                    }
                                }
                                
                                const mean = sum / count;
                                const variance = (sumSq / count) - (mean * mean);
                                const stdDev = Math.sqrt(Math.max(0, variance));
                                
                                const localThreshold = mean + k * stdDev;
                                const binaryValue = grayData[idx] >= localThreshold ? 255 : 0;
                                
                                const pixelIdx = idx * 4;
                                data[pixelIdx] = binaryValue;     // Red
                                data[pixelIdx + 1] = binaryValue; // Green
                                data[pixelIdx + 2] = binaryValue; // Blue
                            }
                        }
                        description = `Binarització de Niblack amb finestra ${windowSize} i k=${k}`;
                        break;
                        
                    case 'dilate':
                    case 'erode':
                    case 'opening':
                    case 'closing':
                        // Check if image is binary for morphological operations
                        if (!isBinaryImage(imageData)) {
                            // Convert to binary first using Otsu-like threshold
                            for (let i = 0; i < data.length; i += 4) {
                                const gray = Math.round((data[i] + data[i + 1] + data[i + 2]) / 3);
                                const binaryValue = gray >= 128 ? 255 : 0;
                                data[i] = binaryValue;
                                data[i + 1] = binaryValue;
                                data[i + 2] = binaryValue;
                            }
                        }
                        
                        const kernelSize = parseInt(parameters.kernelSize);
                        const iterations = parseInt(parameters.iterations);
                        
                        for (let iter = 0; iter < iterations; iter++) {
                            const tempData = new Uint8ClampedArray(data);
                            
                            for (let y = 0; y < canvas.height; y++) {
                                for (let x = 0; x < canvas.width; x++) {
                                    const idx = (y * canvas.width + x) * 4;
                                    
                                    let result = false;
                                    const halfKernel = Math.floor(kernelSize / 2);
                                    
                                    // Apply morphological operation
                                    for (let ky = -halfKernel; ky <= halfKernel; ky++) {
                                        for (let kx = -halfKernel; kx <= halfKernel; kx++) {
                                            const ny = y + ky;
                                            const nx = x + kx;
                                            
                                            if (ny >= 0 && ny < canvas.height && nx >= 0 && nx < canvas.width) {
                                                const nIdx = (ny * canvas.width + nx) * 4;
                                                const isWhite = tempData[nIdx] === 255;
                                                
                                                if (technique === 'dilate' || technique === 'closing') {
                                                    result = result || isWhite;
                                                } else if (technique === 'erode' || technique === 'opening') {
                                                    if (!result) result = true;
                                                    result = result && isWhite;
                                                }
                                            }
                                        }
                                    }
                                    
                                    const value = result ? 255 : 0;
                                    data[idx] = value;
                                    data[idx + 1] = value;
                                    data[idx + 2] = value;
                                }
                            }
                        }
                        
                        // For opening and closing, apply the second operation
                        if (technique === 'opening') {
                            // Already did erosion, now dilate
                            const tempData = new Uint8ClampedArray(data);
                            for (let y = 0; y < canvas.height; y++) {
                                for (let x = 0; x < canvas.width; x++) {
                                    const idx = (y * canvas.width + x) * 4;
                                    let result = false;
                                    const halfKernel = Math.floor(kernelSize / 2);
                                    
                                    for (let ky = -halfKernel; ky <= halfKernel; ky++) {
                                        for (let kx = -halfKernel; kx <= halfKernel; kx++) {
                                            const ny = y + ky;
                                            const nx = x + kx;
                                            
                                            if (ny >= 0 && ny < canvas.height && nx >= 0 && nx < canvas.width) {
                                                const nIdx = (ny * canvas.width + nx) * 4;
                                                const isWhite = tempData[nIdx] === 255;
                                                result = result || isWhite;
                                            }
                                        }
                                    }
                                    
                                    const value = result ? 255 : 0;
                                    data[idx] = value;
                                    data[idx + 1] = value;
                                    data[idx + 2] = value;
                                }
                            }
                        } else if (technique === 'closing') {
                            // Already did dilation, now erode
                            const tempData = new Uint8ClampedArray(data);
                            for (let y = 0; y < canvas.height; y++) {
                                for (let x = 0; x < canvas.width; x++) {
                                    const idx = (y * canvas.width + x) * 4;
                                    let result = true;
                                    const halfKernel = Math.floor(kernelSize / 2);
                                    
                                    for (let ky = -halfKernel; ky <= halfKernel; ky++) {
                                        for (let kx = -halfKernel; kx <= halfKernel; kx++) {
                                            const ny = y + ky;
                                            const nx = x + kx;
                                            
                                            if (ny >= 0 && ny < canvas.height && nx >= 0 && nx < canvas.width) {
                                                const nIdx = (ny * canvas.width + nx) * 4;
                                                const isWhite = tempData[nIdx] === 255;
                                                result = result && isWhite;
                                            }
                                        }
                                    }
                                    
                                    const value = result ? 255 : 0;
                                    data[idx] = value;
                                    data[idx + 1] = value;
                                    data[idx + 2] = value;
                                }
                            }
                        }
                        
                        description = `${technique === 'dilate' ? 'Dilatació' : technique === 'erode' ? 'Erosió' : technique === 'opening' ? 'Obertura' : 'Tancament'} amb kernel ${parameters.kernelShape} de mida ${kernelSize}`;
                        break;
                        
                    case 'labeling':
                        // Convert to binary first if not already
                        if (!isBinaryImage(imageData)) {
                            for (let i = 0; i < data.length; i += 4) {
                                const gray = Math.round((data[i] + data[i + 1] + data[i + 2]) / 3);
                                const binaryValue = gray >= 128 ? 255 : 0;
                                data[i] = binaryValue;
                                data[i + 1] = binaryValue;
                                data[i + 2] = binaryValue;
                            }
                        }
                        
                        // Simple connected component labeling
                        const connectivity = parseInt(parameters.connectivity);
                        const showColors = parameters.showColors === 'true';
                        const labels = new Array(canvas.width * canvas.height).fill(0);
                        let currentLabel = 1;
                        
                        // Colors for different regions
                        const colors = [
                            [255, 0, 0], [0, 255, 0], [0, 0, 255], [255, 255, 0],
                            [255, 0, 255], [0, 255, 255], [128, 0, 128], [255, 128, 0],
                            [128, 255, 0], [0, 128, 255], [255, 0, 128], [128, 128, 255]
                        ];
                        
                        // Flood fill algorithm
                        function floodFill(startX, startY, label) {
                            const stack = [[startX, startY]];
                            
                            while (stack.length > 0) {
                                const [x, y] = stack.pop();
                                const idx = y * canvas.width + x;
                                
                                if (x < 0 || x >= canvas.width || y < 0 || y >= canvas.height) continue;
                                if (labels[idx] !== 0) continue;
                                
                                const pixelIdx = idx * 4;
                                if (data[pixelIdx] !== 255) continue; // Not a white pixel
                                
                                labels[idx] = label;
                                
                                // Add neighbors based on connectivity
                                stack.push([x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]);
                                if (connectivity === 8) {
                                    stack.push([x + 1, y + 1], [x - 1, y - 1], [x + 1, y - 1], [x - 1, y + 1]);
                                }
                            }
                        }
                        
                        // Label all connected components
                        for (let y = 0; y < canvas.height; y++) {
                            for (let x = 0; x < canvas.width; x++) {
                                const idx = y * canvas.width + x;
                                const pixelIdx = idx * 4;
                                
                                if (data[pixelIdx] === 255 && labels[idx] === 0) {
                                    floodFill(x, y, currentLabel);
                                    currentLabel++;
                                }
                            }
                        }
                        
                        regionCount = currentLabel - 1;
                        
                        // Apply colors if requested
                        if (showColors) {
                            for (let i = 0; i < labels.length; i++) {
                                const label = labels[i];
                                if (label > 0) {
                                    const colorIdx = (label - 1) % colors.length;
                                    const color = colors[colorIdx];
                                    const pixelIdx = i * 4;
                                    data[pixelIdx] = color[0];
                                    data[pixelIdx + 1] = color[1];
                                    data[pixelIdx + 2] = color[2];
                                }
                            }
                        }
                        
                        description = `Etiquetatge de regions amb connectivitat ${connectivity}`;
                        break;
                        
                    case 'morphGradient':
                        // Check if image is binary for morphological operations
                        if (!isBinaryImage(imageData)) {
                            // Convert to binary first using Otsu-like threshold
                            for (let i = 0; i < data.length; i += 4) {
                                const gray = Math.round((data[i] + data[i + 1] + data[i + 2]) / 3);
                                const binaryValue = gray >= 128 ? 255 : 0;
                                data[i] = binaryValue;
                                data[i + 1] = binaryValue;
                                data[i + 2] = binaryValue;
                            }
                        }
                        
                        const morphKernelSize = parseInt(parameters.kernelSize);
                        const morphIterations = parseInt(parameters.iterations);
                        
                        // Create dilated and eroded versions
                        const dilatedData = new Uint8ClampedArray(data);
                        const erodedData = new Uint8ClampedArray(data);
                        
                        // Apply dilation
                        for (let iter = 0; iter < morphIterations; iter++) {
                            const tempData = new Uint8ClampedArray(dilatedData);
                            for (let y = 0; y < canvas.height; y++) {
                                for (let x = 0; x < canvas.width; x++) {
                                    const idx = (y * canvas.width + x) * 4;
                                    let result = false;
                                    const halfKernel = Math.floor(morphKernelSize / 2);
                                    
                                    for (let ky = -halfKernel; ky <= halfKernel; ky++) {
                                        for (let kx = -halfKernel; kx <= halfKernel; kx++) {
                                            const ny = y + ky;
                                            const nx = x + kx;
                                            
                                            if (ny >= 0 && ny < canvas.height && nx >= 0 && nx < canvas.width) {
                                                const nIdx = (ny * canvas.width + nx) * 4;
                                                const isWhite = tempData[nIdx] === 255;
                                                result = result || isWhite;
                                            }
                                        }
                                    }
                                    
                                    const value = result ? 255 : 0;
                                    dilatedData[idx] = value;
                                    dilatedData[idx + 1] = value;
                                    dilatedData[idx + 2] = value;
                                }
                            }
                        }
                        
                        // Apply erosion
                        for (let iter = 0; iter < morphIterations; iter++) {
                            const tempData = new Uint8ClampedArray(erodedData);
                            for (let y = 0; y < canvas.height; y++) {
                                for (let x = 0; x < canvas.width; x++) {
                                    const idx = (y * canvas.width + x) * 4;
                                    let result = true;
                                    const halfKernel = Math.floor(morphKernelSize / 2);
                                    
                                    for (let ky = -halfKernel; ky <= halfKernel; ky++) {
                                        for (let kx = -halfKernel; kx <= halfKernel; kx++) {
                                            const ny = y + ky;
                                            const nx = x + kx;
                                            
                                            if (ny >= 0 && ny < canvas.height && nx >= 0 && nx < canvas.width) {
                                                const nIdx = (ny * canvas.width + nx) * 4;
                                                const isWhite = tempData[nIdx] === 255;
                                                result = result && isWhite;
                                            }
                                        }
                                    }
                                    
                                    const value = result ? 255 : 0;
                                    erodedData[idx] = value;
                                    erodedData[idx + 1] = value;
                                    erodedData[idx + 2] = value;
                                }
                            }
                        }
                        
                        // Calculate gradient (difference between dilation and erosion)
                        for (let i = 0; i < data.length; i += 4) {
                            const gradientValue = Math.abs(dilatedData[i] - erodedData[i]);
                            data[i] = gradientValue;
                            data[i + 1] = gradientValue;
                            data[i + 2] = gradientValue;
                        }
                        
                        description = `Gradient morfològic amb kernel ${parameters.kernelShape} de mida ${morphKernelSize}`;
                        break;
                        
                    case 'imageSum':
                        // Get previous image for sum operation
                        if (stepIndex > 1) {
                            const prevImageSrc = processedImages[stepIndex - 2];
                            const prevImg = new Image();
                            prevImg.onload = function() {
                                const prevCanvas = document.createElement('canvas');
                                const prevCtx = prevCanvas.getContext('2d');
                                prevCanvas.width = prevImg.width;
                                prevCanvas.height = prevImg.height;
                                prevCtx.drawImage(prevImg, 0, 0);
                                const prevImageData = prevCtx.getImageData(0, 0, prevCanvas.width, prevCanvas.height);
                                const prevData = prevImageData.data;
                                
                                // Sum images
                                for (let i = 0; i < data.length; i += 4) {
                                    data[i] = Math.min(255, data[i] + (prevData[i] || 0));
                                    data[i + 1] = Math.min(255, data[i + 1] + (prevData[i + 1] || 0));
                                    data[i + 2] = Math.min(255, data[i + 2] + (prevData[i + 2] || 0));
                                }
                                
                                ctx.putImageData(imageData, 0, 0);
                                const processedImageSrc = canvas.toDataURL();
                                
                                resultContainer.innerHTML = `
                                    <div>
                                        <img src="${processedImageSrc}" class="image-display mx-auto rounded-lg shadow-md mb-2" alt="Resultat processat">
                                        <p class="text-sm text-gray-600 italic">Suma de la imatge actual amb l'anterior</p>
                                    </div>
                                `;
                                
                                if (stepIndex < processedImages.length) {
                                    processedImages[stepIndex] = processedImageSrc;
                                } else {
                                    processedImages.push(processedImageSrc);
                                }
                                addStepButton.style.display = 'inline-block';
                            };
                            prevImg.src = prevImageSrc;
                            return; // Exit early as we handle the result in the callback
                        }
                        description = 'Suma d\'imatges (requereix imatge anterior)';
                        break;
                        
                    case 'imageDiff':
                        // Get previous image for difference operation
                        if (stepIndex > 1) {
                            const prevImageSrc = processedImages[stepIndex - 2];
                            const prevImg = new Image();
                            prevImg.onload = function() {
                                const prevCanvas = document.createElement('canvas');
                                const prevCtx = prevCanvas.getContext('2d');
                                prevCanvas.width = prevImg.width;
                                prevCanvas.height = prevImg.height;
                                prevCtx.drawImage(prevImg, 0, 0);
                                const prevImageData = prevCtx.getImageData(0, 0, prevCanvas.width, prevCanvas.height);
                                const prevData = prevImageData.data;
                                
                                // Calculate absolute difference
                                for (let i = 0; i < data.length; i += 4) {
                                    data[i] = Math.abs(data[i] - (prevData[i] || 0));
                                    data[i + 1] = Math.abs(data[i + 1] - (prevData[i + 1] || 0));
                                    data[i + 2] = Math.abs(data[i + 2] - (prevData[i + 2] || 0));
                                }
                                
                                ctx.putImageData(imageData, 0, 0);
                                const processedImageSrc = canvas.toDataURL();
                                
                                resultContainer.innerHTML = `
                                    <div>
                                        <img src="${processedImageSrc}" class="image-display mx-auto rounded-lg shadow-md mb-2" alt="Resultat processat">
                                        <p class="text-sm text-gray-600 italic">Diferència absoluta entre la imatge actual i l'anterior</p>
                                    </div>
                                `;
                                
                                if (stepIndex < processedImages.length) {
                                    processedImages[stepIndex] = processedImageSrc;
                                } else {
                                    processedImages.push(processedImageSrc);
                                }
                                addStepButton.style.display = 'inline-block';
                            };
                            prevImg.src = prevImageSrc;
                            return; // Exit early as we handle the result in the callback
                        }
                        description = 'Diferència d\'imatges (requereix imatge anterior)';
                        break;
                        
                    case 'crop':
                        const startX = Math.round((parseInt(parameters.startX) / 100) * canvas.width);
                        const endX = Math.round((parseInt(parameters.endX) / 100) * canvas.width);
                        const startY = Math.round((parseInt(parameters.startY) / 100) * canvas.height);
                        const endY = Math.round((parseInt(parameters.endY) / 100) * canvas.height);
                        
                        const cropWidth = endX - startX;
                        const cropHeight = endY - startY;
                        
                        if (cropWidth > 0 && cropHeight > 0) {
                            const croppedImageData = ctx.getImageData(startX, startY, cropWidth, cropHeight);
                            canvas.width = cropWidth;
                            canvas.height = cropHeight;
                            ctx.putImageData(croppedImageData, 0, 0);
                        }
                        
                        description = `Retallat de (${startX},${startY}) a (${endX},${endY})`;
                        break;
                        
                    case 'showValues':
                        // Create matrix display
                        let matrixHTML = '<div class="matrix-display text-xs font-mono bg-white p-4 rounded border overflow-auto max-h-96">';
                        
                        // Determine image type
                        const isGrayscale = isGrayscaleImage(imageData);
                        const isBinary = isBinaryImage(imageData);
                        
                        matrixHTML += '<div class="grid gap-1" style="grid-template-columns: repeat(' + canvas.width + ', minmax(0, 1fr));">';
                        
                        for (let y = 0; y < canvas.height; y++) {
                            for (let x = 0; x < canvas.width; x++) {
                                const idx = (y * canvas.width + x) * 4;
                                const r = data[idx];
                                const g = data[idx + 1];
                                const b = data[idx + 2];
                                
                                let cellContent = '';
                                let bgColor = '';
                                let textColor = 'text-black';
                                
                                if (isBinary) {
                                    cellContent = r === 255 ? '1' : '0';
                                    bgColor = r === 255 ? 'bg-white' : 'bg-black';
                                    textColor = r === 255 ? 'text-black' : 'text-white';
                                } else if (isGrayscale) {
                                    cellContent = r.toString();
                                    const intensity = r / 255;
                                    bgColor = `background-color: rgb(${r},${r},${r})`;
                                    textColor = intensity > 0.5 ? 'text-black' : 'text-white';
                                } else {
                                    cellContent = `${r},${g},${b}`;
                                    bgColor = `background-color: rgb(${r},${g},${b})`;
                                    const intensity = (r + g + b) / (3 * 255);
                                    textColor = intensity > 0.5 ? 'text-black' : 'text-white';
                                }
                                
                                matrixHTML += `<div class="p-1 text-center border ${textColor}" style="${bgColor.startsWith('bg-') ? '' : bgColor}">${cellContent}</div>`;
                            }
                        }
                        
                        matrixHTML += '</div></div>';
                        
                        resultContainer.innerHTML = matrixHTML;
                        
                        // Don't process further for matrix display
                        addStepButton.style.display = 'inline-block';
                        return;
                        
                        description = `Matriu de valors ${canvas.width}x${canvas.height}`;
                        break;
                }
                
                ctx.putImageData(imageData, 0, 0);
                const processedImageSrc = canvas.toDataURL();
                
                let resultHTML = `
                    <div>
                        <img src="${processedImageSrc}" class="image-display mx-auto rounded-lg shadow-md mb-2" alt="Resultat processat">
                        <p class="text-sm text-gray-600 italic">${description}</p>
                `;
                
                if (technique === 'labeling') {
                    resultHTML += `<p class="text-sm font-medium text-indigo-600 mt-2">Regions detectades: ${regionCount}</p>`;
                }
                
                resultHTML += `</div>`;
                
                resultContainer.innerHTML = resultHTML;
                
                // Update the processed images array at the correct index
                if (stepIndex < processedImages.length) {
                    processedImages[stepIndex] = processedImageSrc;
                } else {
                    processedImages.push(processedImageSrc);
                }
                addStepButton.style.display = 'inline-block';
            };
            
            img.src = imageSrc;
        }
    </script>
</body></html>
