  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Operacions amb enters</title>
  <style>
    :root {
      --ink: #172033;
      --paper: #fffaf0;
      --coral: #ef6b57;
      --teal: #137a78;
      --muted: #64748b;
      --line: #dce4e6;
      --cream: #fff8df;
      --warm: #fce7c3;
      --white: #ffffff;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; min-width: 0; }

    body {
      width: 100%;
      min-height: 100%;
      color: var(--ink);
      background: var(--paper);
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    }

    button, input { font: inherit; }
    button { cursor: pointer; }

    button:focus-visible,
    input:focus-visible {
      outline: 4px solid rgba(19, 122, 120, .28);
      outline-offset: 3px;
    }

    .app-shell {
      width: 100%;
      min-height: calc(100 * min(var(--vh, 1vh), 1vh));
      overflow: hidden;
      background-image:
        radial-gradient(circle at 12% 10%, rgba(239, 107, 87, .16) 0 2px, transparent 2px),
        radial-gradient(circle at 88% 20%, rgba(19, 122, 120, .14) 0 2px, transparent 2px);
      background-size: 28px 28px, 34px 34px;
    }

    .page-padding {
      width: 100%;
      padding-right: 28px;
      padding-left: 28px;
    }

    .content-width {
      width: 100%;
      max-width: 1280px;
      margin: 0 auto;
    }

    .title-font { font-family: Georgia, "Times New Roman", serif; }
    .hidden { display: none !important; }

    .header-wrap { padding-top: 32px; }

    .header-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 24px 30px;
      border: 1px solid rgba(255, 255, 255, .72);
      border-radius: 28px;
      box-shadow: 0 4px 16px rgba(23, 32, 51, .06);
    }

    .header-kicker {
      margin: 0 0 5px;
      font-size: .75rem;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .page-title {
      margin: 0;
      font-size: clamp(2rem, 4vw, 3rem);
      line-height: 1.1;
    }

    .header-badge {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      flex-shrink: 0;
      padding: 10px 16px;
      border-radius: 999px;
    }

    .main-layout {
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr) 380px;
      gap: 20px;
      padding-top: 20px;
      padding-bottom: 30px;
    }

    .panel, .card {
      border: 1px solid var(--line);
      box-shadow: 0 4px 16px rgba(23, 32, 51, .05);
    }

    .panel {
      padding: 18px;
      border-radius: 28px;
    }

    .card { border-radius: 30px; }

    .panel-heading {
      margin: 0 0 13px;
      padding: 0 8px;
      font-size: 1.1rem;
    }

    .level-list {
      display: grid;
      gap: 8px;
    }

    .level-button {
      width: 100%;
      padding: 12px 15px;
      color: #145c5b;
      text-align: left;
      border: 1px solid transparent;
      border-radius: 16px;
      background: #e7f4f2;
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    }

    .level-button:hover,
    .level-button:focus-visible {
      border-color: rgba(19, 122, 120, .45);
      box-shadow: 0 6px 16px rgba(20, 47, 60, .1);
      transform: translateX(3px);
    }

    .level-button.is-active {
      border-color: var(--teal);
      box-shadow: 0 7px 0 rgba(19, 122, 120, .16);
    }

    .level-button.resta { color: #9f3d2d; background: #fff1ec; }
    .level-button.repte { color: #fff; background: var(--ink); }
    .level-button.repte-final { color: #fff; background: var(--coral); }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat-card { padding: 16px 20px; }
    .score-card { background: #e7f4f2; }
    .streak-card { background: #fff1ec; }

    .stat-label {
      margin: 0;
      font-size: .75rem;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .stat-value {
      margin: 5px 0 0;
      font-size: 2rem;
      line-height: 1;
    }

    .operation-card {
      position: relative;
      padding: 34px;
      overflow: hidden;
      background: var(--white);
    }

    .operation-card::after {
      position: absolute;
      right: -18px;
      bottom: -52px;
      z-index: 0;
      color: rgba(19, 122, 120, .08);
      font: 700 180px/1 Georgia, serif;
      content: "±";
      pointer-events: none;
    }

    .operation-content {
      position: relative;
      z-index: 1;
    }

    .current-label {
      margin: 0;
      font-size: .75rem;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .current-level {
      margin: 8px 0 0;
      font-size: clamp(1.45rem, 3vw, 2rem);
      line-height: 1.2;
    }

    .signs-toggle-row {
      display: flex;
      justify-content: center;
      margin-top: 24px;
    }

    .simplify-button {
      min-width: 230px;
      padding: 13px 18px;
      color: var(--teal);
      border: 2px solid var(--teal);
      border-radius: 16px;
      background: var(--white);
      box-shadow: 0 5px 0 rgba(19, 122, 120, .16);
      font-size: .95rem;
      font-weight: 700;
    }

    .simplify-button:hover,
    .simplify-button:focus-visible {
      box-shadow: 0 7px 0 rgba(19, 122, 120, .2);
      transform: translateY(-2px);
    }

    .simplify-button.is-active {
      color: #fff !important;
      background: var(--teal) !important;
    }

    .equation-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 112px;
      margin: 14px 0 30px;
      padding: 16px;
      border: 1px dashed #b8c5cf;
      border-radius: 24px;
      background: rgba(255, 255, 255, .55);
    }

    .operation-display {
      margin: 0;
      font-size: clamp(2.35rem, 6vw, 4rem);
      line-height: 1;
      letter-spacing: -.04em;
      text-align: center;
    }

    .simplified-operation {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-top: 14px;
    }

    .simplified-arrow {
      color: var(--coral);
      font-size: 1.8rem;
      line-height: 1;
    }

    .simplified-display { font-size: clamp(1.8rem, 4vw, 2.8rem); }

    .answer-label {
      display: block;
      margin-bottom: 8px;
    }

    .answer-row {
      display: flex;
      gap: 12px;
    }

    .answer-input {
      width: 100%;
      min-width: 0;
      padding: 15px 18px;
      color: var(--ink);
      border: 2px solid var(--line);
      border-radius: 16px;
      background: #fff;
      font-size: 1.25rem;
      font-weight: 700;
      appearance: textfield;
    }

    .answer-input:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 4px rgba(19, 122, 120, .13);
      outline: none;
    }

    .answer-input::-webkit-outer-spin-button,
    .answer-input::-webkit-inner-spin-button {
      margin: 0;
      appearance: none;
    }

    .button-main, .button-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 1px solid transparent;
      font-weight: 700;
      transition: transform .18s ease, filter .18s ease, box-shadow .18s ease;
    }

    .button-main:hover, .button-secondary:hover {
      filter: brightness(.97);
      transform: translateY(-2px);
    }

    .button-main {
      flex-shrink: 0;
      padding: 15px 22px;
      border-radius: 16px;
      white-space: nowrap;
    }

    .feedback-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 20px;
    }

    .feedback {
      min-height: 1.4em;
      margin: 0;
      font-weight: 700;
    }

    .feedback-correct { color: #087647; }
    .feedback-wrong { color: #b54738; }
    .feedback-neutral { color: var(--muted); }

    .button-secondary {
      padding: 11px 15px;
      border-radius: 13px;
      white-space: nowrap;
    }

    .tip-options {
      display: grid;
      gap: 4px;
      margin-top: 20px;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 4px 16px rgba(23, 32, 51, .05);
    }

    .auto-copy-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: .86rem;
    }

    .auto-copy-label input {
      width: 16px;
      height: 16px;
      accent-color: var(--teal);
    }

    .aid-title {
      margin: 0;
      font-size: 1.25rem;
    }

    .position-box {
      margin-bottom: 16px;
      padding: 12px 14px;
      text-align: center;
      border: 1px solid #bde7df;
      border-radius: 16px;
      background: #edf8f7;
    }

    .position-label, .distance-label {
      margin: 0;
      font-size: .72rem;
      line-height: 1.2;
    }

    .position-value {
      margin: 3px 0 0;
      color: #115f5d;
      font-size: 1.25rem;
      line-height: 1;
    }

    .distance-label { margin-top: 10px; }

    .distance-value {
      margin: 3px 0 0;
      color: #115f5d;
      font-size: .95rem;
      line-height: 1;
    }

    .copy-button {
      margin-top: 9px;
      padding: 8px 12px;
      color: var(--teal);
      background: #d9f1ee;
    }

    .scale {
      position: relative;
      width: 100%;
      height: 470px;
      overflow: hidden;
      border: 1px solid #d6e5e2;
      border-radius: 24px;
      background: linear-gradient(180deg, #edf8f7 0%, #fffdfa 47%, #fff0ea 100%);
    }

    #ticks {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    .scale-axis {
      position: absolute;
      top: 18px;
      bottom: 18px;
      left: 50%;
      z-index: 2;
      width: 3px;
      border-radius: 10px;
      background: #64748b;
      transform: translateX(-50%);
    }

    .scale-zero {
      position: absolute;
      right: 24px;
      left: 24px;
      z-index: 1;
      height: 2px;
      opacity: .9;
      background: #64748b;
      transform: translateY(50%);
    }

    .tick {
      position: absolute;
      left: calc(50% - 16px);
      z-index: 1;
      width: 32px;
      height: 2px;
      background: #94a3b8;
      transform: translateY(50%);
    }

    .tick-label {
      position: absolute;
      left: calc(50% + 18px);
      z-index: 3;
      padding: 2px 5px;
      color: #475569;
      border-radius: 5px;
      background: rgba(255, 255, 255, .9);
      font-size: .7rem;
      font-weight: 700;
      line-height: 1;
      transform: translateY(50%);
    }

    .path-line {
      position: absolute;
      left: 50%;
      width: 6px;
      border-radius: 12px;
      background: repeating-linear-gradient(to bottom, #ef6b57 0 8px, transparent 8px 13px);
      transform: translateX(-50%);
      transition: bottom .45s ease, height .45s ease;
    }

    .marker {
      position: absolute;
      left: 50%;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      color: white;
      border-radius: 50%;
      box-shadow: 0 5px 12px rgba(20, 47, 60, .18);
      font-size: .78rem;
      font-weight: 700;
      transform: translate(-50%, 50%);
      transition: bottom .45s cubic-bezier(.2, .8, .2, 1);
      touch-action: none;
    }

    .marker-start { background: var(--teal); }
    .marker-end { background: var(--coral); }

    .elevator-box {
      position: absolute;
      left: calc(50% - 52px);
      z-index: 5;
      width: 38px;
      height: 54px;
      border: 3px solid var(--ink);
      border-radius: 6px 6px 3px 3px;
      background: #f5cb4f;
      box-shadow: inset 0 0 0 3px rgba(255, 255, 255, .35);
      transform: translateY(50%);
      transition: bottom .45s cubic-bezier(.2, .8, .2, 1);
    }

    .confetti-layer {
      position: absolute;
      inset: 0;
      z-index: 4;
      overflow: hidden;
      pointer-events: none;
    }

    .confetti {
      position: absolute;
      top: -24px;
      left: var(--x);
      width: 10px;
      height: 18px;
      opacity: 0;
      border-radius: 2px;
      background: var(--confetti-color);
      transform: rotate(var(--rotation));
    }

    .confetti.circle {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }

    .confetti.ribbon {
      width: 7px;
      height: 22px;
      border-radius: 999px;
    }

    .confetti-layer.is-celebrating .confetti {
      animation: confetti-fall 1.15s cubic-bezier(.16, .7, .27, 1) forwards;
      animation-delay: var(--delay);
    }

    @keyframes confetti-fall {
      0% { opacity: 0; transform: translate3d(0, -20px, 0) rotate(var(--rotation)); }
      10% { opacity: 1; }
      100% { opacity: 0; transform: translate3d(var(--drift), 260px, 0) rotate(calc(var(--rotation) + 540deg)); }
    }

    @media (max-width: 1050px) {
      .main-layout { grid-template-columns: 240px minmax(0, 1fr); }
      .aid-panel { grid-column: 1 / -1; }
      .aid-panel-inner {
        display: grid;
        grid-template-columns: 270px minmax(0, 1fr);
        gap: 20px;
        align-items: start;
      }
    }

    @media (max-width: 720px) {
      .page-padding {
        padding-right: 16px;
        padding-left: 16px;
      }

      .header-wrap { padding-top: 18px; }

      .header-banner {
        flex-direction: column;
        align-items: flex-start;
        padding: 20px;
      }

      .main-layout {
        grid-template-columns: 1fr;
        padding-top: 16px;
      }

      .level-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .operation-card { padding: 22px; }

      .answer-row, .feedback-row {
        flex-direction: column;
        align-items: stretch;
      }

      .button-main, .button-secondary { width: 100%; }
      .aid-panel { grid-column: auto; }
      .aid-panel-inner { display: block; }
      .scale { height: 390px; }
    }

    @media (max-width: 430px) {
      .level-list { grid-template-columns: 1fr; }
      .stat-grid { gap: 8px; }
      .stat-card { padding: 14px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
        animation-duration: .01ms !important;
      }
    }
  </style>

         <p id="operation-display" class="title-font operation-display" aria-live="polite">(+4) + (+7)</p>
         <div id="simplified-operation" class="simplified-operation hidden" aria-live="polite"><span class="simplified-arrow" aria-hidden="true">↓</span>
          <p id="simplified-display" class="title-font operation-display simplified-display">+4 + 7</p>
         </div>
        </div>
        <form id="answer-form" novalidate><label data-template-id="answer-label" for="answer-input" class="canva-text answer-label">Quin és el resultat?</label>
         <div class="answer-row"><input id="answer-input" class="answer-input" type="number" inputmode="numeric" autocomplete="off" required aria-label="Resposta"> <button data-template-id="check-button" type="submit" class="canva-button button-main" style="background:#137a78;color:#ffffff"> <span aria-hidden="true">✓</span> <span data-template-id="check-button-text" class="canva-text">Comprova</span> </button>
         </div>
        </form>
        <div class="feedback-row">
         <p id="feedback" class="feedback feedback-neutral" aria-live="polite"></p><button id="new-operation-button" data-template-id="new-operation-button" type="button" class="canva-button button-secondary" style="background:#fce7c3;color:#7c4309"> <span aria-hidden="true">↻</span> <span data-template-id="new-operation-button-text" class="canva-text">Nova operació</span> </button>
        </div>
       </div>
      </article>
      <div class="tip-options"><label data-template-id="auto-copy-label" class="canva-text auto-copy-label"> <input id="auto-copy-toggle" type="checkbox" checked> <span data-template-id="auto-copy-label-text" class="canva-text">Copiar automàticament en arrossegar</span> </label> <label data-template-id="reset-simplify-label" class="canva-text auto-copy-label"> <input id="reset-simplify-toggle" type="checkbox" checked> <span data-template-id="reset-simplify-label-text" class="canva-text">No simplificar en una nova operació</span> </label>
      </div>
     </section>
     <aside data-template-id="aid-panel" class="canva-panel panel aid-panel">
      <div class="aid-panel-inner">
       <div>
        <h2 data-template-id="aid-title" class="canva-text aid-title">Ajuda visual</h2>
       </div>
       <div id="visual-aid">
        <div class="position-box">
         <p data-template-id="position-label" class="canva-text position-label">Posició del punt vermell</p>
         <p id="position-value" class="position-value" aria-live="polite">+0</p>
         <p data-template-id="distance-label" class="canva-text distance-label">Distància entre els dos punts</p>
         <p id="distance-value" class="distance-value" aria-live="polite">0</p><button id="copy-distance-button" data-template-id="copy-distance-button" type="button" class="canva-button button-secondary copy-button hidden"> <span aria-hidden="true">⎘</span> <span data-template-id="copy-distance-button-text" class="canva-text">Copia la posició</span> </button>
        </div>
        <div id="scale" class="scale" aria-label="Representació vertical de l'operació">
         <div class="scale-axis"></div>
         <div id="zero-line" class="scale-zero"></div>
         <div id="ticks"></div>
         <div id="path-line" class="path-line"></div>
         <div id="start-marker" class="marker marker-start">
          0
         </div>
         <div id="end-marker" class="marker marker-end">
          0
         </div>
         <div id="elevator-box" class="elevator-box" aria-hidden="true"></div>
        </div>
       </div>
      </div>
     </aside>
    </div>
   </main>
  </div>
  <script>
    const levelNames = {
      "1": "Suma dos nombres positius",
      "2": "Suma dos nombres negatius",
      "3": "Suma nombres amb signes diferents",
      "4": "Resta dos nombres positius",
      "5": "Resta dos nombres negatius",
      "6": "Resta nombres amb signes diferents",
      "challenge-1": "Repte 1 · Sumes barrejades",
      "challenge-2": "Repte 2 · Restes barrejades",
      "challenge-3": "Repte 3 · Sumes i restes"
    };

    let activeLevel = "1";
    let score = 0;
    let streak = 0;
    let simplifySigns = false;
    let currentOperation = { first: 4, second: 7, symbol: "+", answer: 11 };
    let visualAnswer = currentOperation.first;
    let celebrationTimer;
    let draggingMarker = false;

    const resetSimplifyToggle = document.getElementById("reset-simplify-toggle");
    const operationDisplay = document.getElementById("operation-display");
    const currentLevelDisplay = document.getElementById("current-level");
    const answerInput = document.getElementById("answer-input");
    const feedback = document.getElementById("feedback");
    const scoreValue = document.getElementById("score-value");
    const streakValue = document.getElementById("streak-value");
    const confettiLayer = document.getElementById("confetti-layer");
    const scale = document.getElementById("scale");
    const endMarker = document.getElementById("end-marker");
    const autoCopyToggle = document.getElementById("auto-copy-toggle");
    const copyDistanceButton = document.getElementById("copy-distance-button");

    function randomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function nonZeroPositive() {
      return randomInt(1, 12);
    }

    function nonZeroNegative() {
      return -randomInt(1, 12);
    }

    function mixedPair() {
      const positive = nonZeroPositive();
      const negative = nonZeroNegative();
      return Math.random() > 0.5 ? [positive, negative] : [negative, positive];
    }

    function makeOperation(level) {
      let first;
      let second;
      let symbol;

      if (level === "1") [first, second, symbol] = [nonZeroPositive(), nonZeroPositive(), "+"];
      if (level === "2") [first, second, symbol] = [nonZeroNegative(), nonZeroNegative(), "+"];
      if (level === "3") [first, second, symbol] = [...mixedPair(), "+"];
      if (level === "4") [first, second, symbol] = [nonZeroPositive(), nonZeroPositive(), "−"];
      if (level === "5") [first, second, symbol] = [nonZeroNegative(), nonZeroNegative(), "−"];
      if (level === "6") [first, second, symbol] = [...mixedPair(), "−"];
      if (level === "challenge-1") return makeOperation(String(randomInt(1, 3)));
      if (level === "challenge-2") return makeOperation(String(randomInt(4, 6)));
      if (level === "challenge-3") return makeOperation(String(randomInt(1, 6)));

      return {
        first: first,
        second: second,
        symbol: symbol,
        answer: symbol === "+" ? first + second : first - second
      };
    }

    function signedNumber(number) {
      return number >= 0 ? "+" + number : String(number);
    }

    function signedOperand(number) {
      return "(" + signedNumber(number) + ")";
    }

    function operationText() {
      const first = currentOperation.first;
      const second = currentOperation.second;
      const symbol = currentOperation.symbol;

      if (!simplifySigns) {
        return signedOperand(first) + " " + symbol + " " + signedOperand(second);
      }

      const simplifiedSymbol = second < 0
        ? (symbol === "+" ? "−" : "+")
        : symbol;

      return signedNumber(first) + " " + simplifiedSymbol + " " + Math.abs(second);
    }

    function celebrate() {
      clearTimeout(celebrationTimer);
      confettiLayer.classList.remove("is-celebrating");

      requestAnimationFrame(function () {
        confettiLayer.classList.add("is-celebrating");
      });

      celebrationTimer = setTimeout(function () {
        confettiLayer.classList.remove("is-celebrating");
      }, 1450);
    }

    function getScaleBounds() {
      const values = [
        currentOperation.first,
        currentOperation.second,
        currentOperation.answer,
        0
      ];

      const minimum = Math.min.apply(null, values);
      const maximum = Math.max.apply(null, values);
      const span = Math.max(12, maximum - minimum);
      const padding = Math.max(2, Math.ceil(span * 0.2));

      return {
        min: Math.floor((minimum - padding) / 2) * 2,
        max: Math.ceil((maximum + padding) / 2) * 2
      };
    }

    function valueToPosition(value) {
      const bounds = getScaleBounds();
      const bounded = Math.max(bounds.min, Math.min(bounds.max, value));
      return 7 + ((bounded - bounds.min) / (bounds.max - bounds.min)) * 86;
    }

    function updateTicks() {
      const ticks = document.getElementById("ticks");
      const bounds = getScaleBounds();

      while (ticks.firstChild) {
        ticks.removeChild(ticks.firstChild);
      }

      for (let value = bounds.min; value <= bounds.max; value += 1) {
        const bottom = valueToPosition(value);
        const tick = document.createElement("span");
        const label = document.createElement("span");

        tick.className = "tick";
        tick.style.bottom = bottom + "%";

        label.className = "tick-label";
        label.style.bottom = bottom + "%";
        label.textContent = value > 0 ? "+" + value : value;

        ticks.appendChild(tick);
        ticks.appendChild(label);
      }
    }

    function updateVisualAid() {
      const start = currentOperation.first;
      const end = visualAnswer;
      const startPosition = valueToPosition(start);
      const endPosition = valueToPosition(end);
      const line = document.getElementById("path-line");
      const startMarker = document.getElementById("start-marker");
      const elevator = document.getElementById("elevator-box");

      startMarker.style.bottom = startPosition + "%";
      endMarker.style.bottom = endPosition + "%";
      startMarker.textContent = signedNumber(start);
      endMarker.textContent = signedNumber(end);

      line.style.bottom = Math.min(startPosition, endPosition) + "%";
      line.style.height = Math.max(4, Math.abs(endPosition - startPosition)) + "%";

      document.getElementById("zero-line").style.bottom = valueToPosition(0) + "%";

      elevator.style.bottom = startPosition + "%";
      requestAnimationFrame(function () {
        elevator.style.bottom = endPosition + "%";
      });

      document.getElementById("position-value").textContent = signedNumber(end);
      document.getElementById("distance-value").textContent = Math.abs(end - start);
    }

    function updateAidButtons() {
      const signsChoice = document.getElementById("signs-choice");
      const simplifiedOperation = document.getElementById("simplified-operation");

      signsChoice.classList.toggle("is-active", simplifySigns);
      signsChoice.setAttribute("aria-pressed", String(simplifySigns));
      simplifiedOperation.classList.toggle("hidden", !simplifySigns);
    }

    function newOperation(options) {
      const settings = options || {};
      const clearFeedback = settings.clearFeedback !== false;

      if (resetSimplifyToggle.checked) {
        simplifySigns = false;
      }

      currentOperation = makeOperation(activeLevel);
      visualAnswer = currentOperation.first;

      operationDisplay.textContent = signedOperand(currentOperation.first) + " " + currentOperation.symbol + " " + signedOperand(currentOperation.second);
      document.getElementById("simplified-display").textContent = operationText();
      currentLevelDisplay.textContent = levelNames[activeLevel];
      answerInput.value = "";

      if (clearFeedback) {
        feedback.textContent = "";
        feedback.className = "feedback feedback-neutral";
      }

      updateAidButtons();
      updateTicks();
      updateVisualAid();
      answerInput.focus();
    }

    function setActiveLevel(level) {
      activeLevel = level;

      document.querySelectorAll("[data-level]").forEach(function (button) {
        const selected = button.dataset.level === level;
        button.classList.toggle("is-active", selected);
        button.setAttribute("aria-pressed", String(selected));
      });

      newOperation();
    }

    function markerValueFromPointer(event) {
      const bounds = getScaleBounds();
      const rect = scale.getBoundingClientRect();
      const ratio = 1 - ((event.clientY - rect.top) / rect.height);
      const raw = bounds.min + ratio * (bounds.max - bounds.min);

      return Math.round(Math.max(bounds.min, Math.min(bounds.max, raw)));
    }

    document.querySelectorAll("[data-level]").forEach(function (button) {
      button.addEventListener("click", function () {
        setActiveLevel(button.dataset.level);
      });
    });

    document.getElementById("answer-form").addEventListener("submit", function (event) {
      event.preventDefault();

      if (answerInput.value.trim() === "") {
        feedback.textContent = "Escriu un resultat abans de comprovar.";
        feedback.className = "feedback feedback-wrong";
        answerInput.focus();
        return;
      }

      const givenAnswer = Number(answerInput.value);

      if (givenAnswer === currentOperation.answer) {
        score += 1;
        streak += 1;
        scoreValue.textContent = score;
        streakValue.textContent = streak;
        feedback.textContent = "Molt bé! Has encertat el resultat.";
        feedback.className = "feedback feedback-correct";
        celebrate();
        newOperation({ clearFeedback: false });
      } else {
        streak = 0;
        streakValue.textContent = streak;
        feedback.textContent = "Encara no. Representa el moviment a l'ajuda visual i torna-ho a provar.";
        feedback.className = "feedback feedback-wrong";
      }
    });

    document.getElementById("new-operation-button").addEventListener("click", function () {
      newOperation();
    });

    document.getElementById("signs-choice").addEventListener("click", function () {
      simplifySigns = !simplifySigns;
      document.getElementById("simplified-display").textContent = operationText();
      updateAidButtons();
    });

    copyDistanceButton.addEventListener("click", function () {
      answerInput.value = visualAnswer;
      answerInput.focus();
    });

    autoCopyToggle.addEventListener("change", function () {
      copyDistanceButton.classList.toggle("hidden", autoCopyToggle.checked);
    });

    endMarker.addEventListener("pointerdown", function (event) {
      draggingMarker = true;
      endMarker.setPointerCapture(event.pointerId);
      endMarker.style.cursor = "grabbing";
      event.preventDefault();
    });

    endMarker.addEventListener("pointermove", function (event) {
      if (!draggingMarker) return;

      visualAnswer = markerValueFromPointer(event);

      if (autoCopyToggle.checked) {
        answerInput.value = visualAnswer;
      }

      updateVisualAid();
    });

    function stopDragging(event) {
      if (!draggingMarker) return;

      draggingMarker = false;
      endMarker.releasePointerCapture(event.pointerId);
      endMarker.style.cursor = "grab";
    }

    endMarker.addEventListener("pointerup", stopDragging);
    endMarker.addEventListener("pointercancel", stopDragging);
    endMarker.style.cursor = "grab";

    updateAidButtons();
    setActiveLevel("1");
  </script>
 </body>
</html>
