  <style>
    :root {
      --ink: #172033;
      --paper: #fffaf0;
      --coral: #ef6b57;
      --teal: #137a78;
      --muted: #64748b;
      --line: #dce4e6;
      --cream: #fff8df;
      --warm: #fce7c3;
    }

    * { box-sizing: border-box; }

    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: "DM Sans", "Trebuchet MS", sans-serif;
    }

    button, input { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible,
    input:focus-visible {
      outline: 4px solid rgba(19, 122, 120, .28);
      outline-offset: 3px;
    }

    .app-shell {
      width: 100%;
      min-height: calc(100 * min(var(--vh, 1vh), 1vh));
      overflow: hidden;
      background-image:
        radial-gradient(circle at 12% 10%, rgba(239, 107, 87, .16) 0 2px, transparent 2px),
        radial-gradient(circle at 88% 20%, rgba(19, 122, 120, .14) 0 2px, transparent 2px);
      background-size: 28px 28px, 34px 34px;
    }

    .page-padding { width: 100%; padding-left: 28px; padding-right: 28px; }
    .content-width { width: 100%; max-width: 1280px; margin: 0 auto; }
    .title-font { font-family: Georgia, "Times New Roman", serif; }
    .hidden { display: none !important; }
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .header-wrap { padding-top: 32px; }
    .header-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 24px 30px;
      border: 1px solid rgba(255,255,255,.72);
      border-radius: 28px;
      box-shadow: 0 4px 16px rgba(23,32,51,.06);
    }

    .header-kicker {
      margin: 0 0 5px;
      font-size: .75rem;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .page-title {
      margin: 0;
      line-height: 1.1;
      font-size: clamp(2rem, 4vw, 3rem);
    }

    .header-badge {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      flex-shrink: 0;
      padding: 10px 16px;
      border-radius: 999px;
    }

    .main-layout {
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr) 380px;
      gap: 20px;
      padding-top: 20px;
      padding-bottom: 30px;
    }

    .panel, .card {
      border: 1px solid var(--line);
      box-shadow: 0 4px 16px rgba(23,32,51,.05);
    }

    .panel { border-radius: 28px; padding: 18px; }
    .card { border-radius: 30px; }

    .panel-heading {
      margin: 0 0 13px;
      padding: 0 8px;
      font-size: 1.1rem;
    }

    .level-list { display: grid; gap: 8px; }

    .level-button {
      width: 100%;
      padding: 12px 15px;
      border: 1px solid transparent;
      border-radius: 16px;
      text-align: left;
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    }

    .level-button:hover,
    .level-button:focus-visible {
      transform: translateX(3px);
      border-color: rgba(19, 122, 120, .45);
      box-shadow: 0 6px 16px rgba(20,47,60,.1);
    }

    .level-button.is-active {
      border-color: var(--teal);
      box-shadow: 0 7px 0 rgba(19,122,120,.16);
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat-card { padding: 16px 20px; }
    .stat-label {
      margin: 0;
      font-size: .75rem;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    .stat-value { margin: 5px 0 0; font-size: 2rem; line-height: 1; }

    .operation-card {
      position: relative;
      overflow: hidden;
      padding: 34px;
    }

    .operation-card::after {
      content: "±";
      position: absolute;
      right: -18px;
      bottom: -52px;
      z-index: 0;
      color: rgba(19,122,120,.08);
      font: 700 180px/1 Georgia, serif;
      pointer-events: none;
    }

    .operation-content { position: relative; z-index: 1; }
    .current-label {
      margin: 0;
      font-size: .75rem;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .current-level {
      margin: 8px 0 0;
      font-size: clamp(1.45rem, 3vw, 2rem);
      line-height: 1.2;
    }

    .signs-toggle-row {
      display: flex;
      justify-content: center;
      margin-top: 24px;
    }

    .simplify-button {
      min-width: 230px;
      padding: 13px 18px;
      border: 2px solid var(--teal);
      border-radius: 16px;
      box-shadow: 0 5px 0 rgba(19,122,120,.16);
      font-size: .95rem;
    }

    .simplify-button:hover,
    .simplify-button:focus-visible {
      transform: translateY(-2px);
      box-shadow: 0 7px 0 rgba(19,122,120,.2);
    }

    .equation-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 112px;
      margin: 14px 0 30px;
      padding: 16px;
      border: 1px dashed #b8c5cf;
      border-radius: 24px;
      background: rgba(255,255,255,.55);
    }

    .operation-display {
      margin: 0;
      font-size: clamp(2.35rem, 6vw, 4rem);
      line-height: 1;
      text-align: center;
      letter-spacing: -.04em;
    }

    .simplified-operation {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-top: 14px;
    }

    .simplified-arrow {
      color: var(--coral);
      font-size: 1.8rem;
      line-height: 1;
    }

    .simplified-display {
      font-size: clamp(1.8rem, 4vw, 2.8rem);
    }

    .answer-label { display: block; margin-bottom: 8px; }
    .answer-row { display: flex; gap: 12px; }

    .answer-input {
      width: 100%;
      min-width: 0;
      padding: 15px 18px;
      color: #172033;
      border: 2px solid #dce4e6;
      border-radius: 16px;
      background: #fff;
      font-size: 1.25rem;
      font-weight: 700;
      appearance: textfield;
      transition: border-color .2s ease, box-shadow .2s ease;
    }

    .answer-input:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 4px rgba(19,122,120,.13);
      outline: none;
    }

    .answer-input::-webkit-outer-spin-button,
    .answer-input::-webkit-inner-spin-button { appearance: none; margin: 0; }

    .button-main, .button-secondary, .aid-choice {
      border: 1px solid transparent;
      font-weight: 700;
      transition: transform .18s ease, filter .18s ease, box-shadow .18s ease;
    }

    .button-main:hover, .button-secondary:hover { transform: translateY(-2px); filter: brightness(.97); }
    .button-main {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-shrink: 0;
      padding: 15px 22px;
      border-radius: 16px;
      white-space: nowrap;
    }

    .feedback-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 20px;
    }

    .feedback { min-height: 1.4em; margin: 0; font-weight: 700; }
    .feedback-correct { color: #087647; }
    .feedback-wrong { color: #b54738; }
    .feedback-neutral { color: #64748b; }

    .button-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 11px 15px;
      border-radius: 13px;
      white-space: nowrap;
    }

    .tip-panel {
      display: flex;
      gap: 12px;
      margin-top: 20px;
      padding: 17px 20px;
      border-radius: 24px;
    }

    .tip-icon, .aid-icon { flex-shrink: 0; font-size: 1.3rem; }
    .tip-title { margin: 0; font-size: 1.1rem; }
    .tip-text { margin: 5px 0 0; line-height: 1.55; }
    .tip-options {
      display: grid;
      gap: 4px;
      margin-top: 20px;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: #ffffff;
      box-shadow: 0 4px 16px rgba(23,32,51,.05);
    }

    .aid-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .aid-title { margin: 0; font-size: 1.25rem; }
    .aid-subtitle { margin: 5px 0 0; line-height: 1.35; }

    .aid-options {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 16px;
    }

    .aid-choice {
      min-height: 40px;
      padding: 8px;
      border-radius: 12px;
    }

    .aid-choice.is-active {
      background: #137a78 !important;
      color: #fff !important;
      border-color: #137a78 !important;
    }

    .position-box {
      margin-bottom: 16px;
      padding: 12px 14px;
      text-align: center;
      border: 1px solid #bde7df;
      border-radius: 16px;
      background: #edf8f7;
    }

    .position-label, .distance-label { margin: 0; font-size: .72rem; line-height: 1.2; }
    .position-value { margin: 3px 0 0; color: #115f5d; font-size: 1.25rem; line-height: 1; }
    .distance-label { margin-top: 10px; }
    .distance-value { margin: 3px 0 0; color: #115f5d; font-size: .95rem; line-height: 1; }

    .auto-copy-label {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 10px;
      font-size: .86rem;
    }

    .auto-copy-label input { width: 16px; height: 16px; accent-color: var(--teal); }
    .copy-button { margin-top: 9px; padding: 8px 12px; border-radius: 12px; }

    .scale {
      position: relative;
      width: 100%;
      max-width: none;
      height: 470px;
      margin: 0 auto;
      overflow: hidden;
      border: 1px solid #d6e5e2;
      border-radius: 24px;
      background: linear-gradient(180deg, #edf8f7 0%, #fffdfa 47%, #fff0ea 100%);
    }

    #ticks {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    .scale-axis {
      position: absolute;
      top: 18px;
      bottom: 18px;
      left: 50%;
      z-index: 2;
      width: 3px;
      border-radius: 10px;
      transform: translateX(-50%);
      background: #64748b;
    }

    .scale-zero {
      position: absolute;
      left: 24px;
      right: 24px;
      z-index: 1;
      height: 2px;
      opacity: .9;
      transform: translateY(50%);
      background: #64748b;
    }

    .tick {
      position: absolute;
      left: calc(50% - 16px);
      right: auto;
      z-index: 1;
      width: 32px;
      height: 2px;
      transform: translateY(50%);
      background: #94a3b8;
    }

    .tick-label {
      position: absolute;
      left: calc(50% + 18px);
      z-index: 3;
      padding: 2px 5px;
      border-radius: 5px;
      color: #475569;
      background: rgba(255,255,255,.9);
      font-size: .7rem;
      font-weight: 700;
      line-height: 1;
      transform: translateY(50%);
    }

    .path-line {
      position: absolute;
      left: 50%;
      width: 6px;
      border-radius: 12px;
      transform: translateX(-50%);
      background: repeating-linear-gradient(to bottom, #ef6b57 0 8px, transparent 8px 13px);
      transition: bottom .45s ease, height .45s ease;
    }

    .marker {
      position: absolute;
      left: 50%;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      color: white;
      border-radius: 50%;
      box-shadow: 0 5px 12px rgba(20,47,60,.18);
      font-size: .78rem;
      font-weight: 700;
      transform: translate(-50%, 50%);
      transition: bottom .45s cubic-bezier(.2,.8,.2,1);
      touch-action: none;
    }

    .marker-start { background: #137a78; }
    .marker-end { background: #ef6b57; }

    .elevator-box {
      position: absolute;
      left: calc(50% - 52px);
      z-index: 5;
      width: 38px;
      height: 54px;
      border: 3px solid #172033;
      border-radius: 6px 6px 3px 3px;
      background: #f5cb4f;
      box-shadow: inset 0 0 0 3px rgba(255,255,255,.35);
      transform: translateY(50%);
      transition: bottom .45s cubic-bezier(.2,.8,.2,1);
    }

    .aid-description {
      margin: 15px 0 0;
      color: #475569;
      text-align: center;
      font-size: .86rem;
      font-weight: 700;
      line-height: 1.4;
    }

    .footer { padding-bottom: 24px; }
    .footer-text { margin: 0; text-align: center; }

    .confetti-layer {
      position: absolute;
      inset: 0;
      z-index: 4;
      overflow: hidden;
      pointer-events: none;
    }

    .confetti {
      position: absolute;
      top: -24px;
      left: var(--x);
      width: 10px;
      height: 18px;
      opacity: 0;
      border-radius: 2px;
      background: var(--confetti-color);
      transform: rotate(var(--rotation));
    }

    .confetti-layer.is-celebrating .confetti {
      animation: confetti-fall 1.15s cubic-bezier(.16,.7,.27,1) forwards;
      animation-delay: var(--delay);
    }

    .confetti.circle { width: 12px; height: 12px; border-radius: 50%; }
    .confetti.ribbon { width: 7px; height: 22px; border-radius: 999px; }

    @keyframes confetti-fall {
      0% { opacity: 0; transform: translate3d(0,-20px,0) rotate(var(--rotation)); }
      10% { opacity: 1; }
      100% { opacity: 0; transform: translate3d(var(--drift), 260px, 0) rotate(calc(var(--rotation) + 540deg)); }
    }

    @media (max-width: 1050px) {
      .main-layout { grid-template-columns: 240px minmax(0, 1fr); }
      .aid-panel { grid-column: 1 / -1; }
      .aid-panel-inner { display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 20px; align-items: start; }
      .aid-options { max-width: 220px; }
    }

    @media (max-width: 720px) {
      .page-padding { padding-left: 16px; padding-right: 16px; }
      .header-wrap { padding-top: 18px; }
      .header-banner { align-items: flex-start; flex-direction: column; padding: 20px; }
      .main-layout { grid-template-columns: 1fr; padding-top: 16px; }
      .level-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .operation-card { padding: 22px; }
      .answer-row, .feedback-row { align-items: stretch; flex-direction: column; }
      .button-main, .button-secondary { width: 100%; }
      .aid-panel { grid-column: auto; }
      .aid-panel-inner { display: block; }
      .scale { max-width: none; height: 390px; }
    }

    @media (max-width: 430px) {
      .level-list { grid-template-columns: 1fr; }
      .stat-grid { gap: 8px; }
      .stat-card { padding: 14px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; }
    }
  </style>

         </div>
        </div>
        <form id="answer-form" novalidate><label data-template-id="answer-label" for="answer-input" class="canva-text answer-label"></label>
         <div class="answer-row"><input id="answer-input" class="answer-input" type="number" inputmode="numeric" autocomplete="off" required> <button data-template-id="check-button" type="submit" class="canva-button button-main"> <span aria-hidden="true">✓</span> <span data-template-id="check-button-text" class="canva-text"></span> </button>
         </div>
        </form>
        <div class="feedback-row">
         <p id="feedback" class="feedback feedback-neutral" aria-live="polite"></p><button id="new-operation-button" data-template-id="new-operation-button" type="button" class="canva-button button-secondary"> <span aria-hidden="true">↻</span> <span data-template-id="new-operation-button-text" class="canva-text"></span> </button>
        </div>
       </div>
      </article>
      <div class="tip-options">
       <label data-template-id="auto-copy-label" class="canva-text auto-copy-label"><input id="auto-copy-toggle" type="checkbox" checked> <span data-template-id="auto-copy-label-text" class="canva-text"></span></label> <label data-template-id="reset-simplify-label" class="canva-text auto-copy-label"><input id="reset-simplify-toggle" type="checkbox" checked> <span data-template-id="reset-simplify-label-text" class="canva-text"></span></label>
      </div>
     </section>
     <aside data-template-id="aid-panel" class="canva-panel panel aid-panel">
      <div class="aid-panel-inner">
       <div>
        <div class="aid-header">
         <div>
          <h2 data-template-id="aid-title" class="canva-text aid-title"></h2>
         </div>
        </div>
       </div>
       <div id="visual-aid">
        <div class="position-box">
         <p data-template-id="position-label" class="canva-text position-label"></p>
         <p id="position-value" class="position-value" aria-live="polite">+0</p>
         <p data-template-id="distance-label" class="canva-text distance-label"></p>
         <p id="distance-value" class="distance-value" aria-live="polite">0</p><button id="copy-distance-button" data-template-id="copy-distance-button" type="button" class="canva-button button-secondary copy-button hidden"> <span aria-hidden="true">⎘</span> <span data-template-id="copy-distance-button-text" class="canva-text"></span> </button>
        </div>
        <div id="scale" class="scale" aria-label="Representació vertical de l'operació">
         <div class="scale-axis"></div>
         <div id="zero-line" class="scale-zero"></div>
         <div id="ticks"></div>
         <div id="path-line" class="path-line"></div>
         <div id="start-marker" class="marker marker-start">
          0
         </div>
         <div id="end-marker" class="marker marker-end">
          0
         </div>
         <div id="elevator-box" class="elevator-box"></div>
        </div>
       </div>
      </div>
     </aside>
    </div>
   </main>
  </div>
  <script>
    const levelNames = {
      "1": "Suma dos nombres positius",
      "2": "Suma dos nombres negatius",
      "3": "Suma nombres amb signes diferents",
      "4": "Resta dos nombres positius",
      "5": "Resta dos nombres negatius",
      "6": "Resta nombres amb signes diferents",
      "challenge-1": "Repte 1 · Sumes barrejades",
      "challenge-2": "Repte 2 · Restes barrejades",
      "challenge-3": "Repte 3 · Sumes i restes"
    };

    let activeLevel = "1";
    let score = 0;
    let streak = 0;
    let aidMode = "elevator";
    let simplifySigns = false;
    let currentOperation = { first: 4, second: 7, symbol: "+", answer: 11 };
    const resetSimplifyToggle = document.getElementById("reset-simplify-toggle");
    let visualAnswer = currentOperation.first;
    let celebrationTimer;

    const operationDisplay = document.getElementById("operation-display");
    const currentLevelDisplay = document.getElementById("current-level");
    const answerInput = document.getElementById("answer-input");
    const feedback = document.getElementById("feedback");
    const scoreValue = document.getElementById("score-value");
    const streakValue = document.getElementById("streak-value");
    const confettiLayer = document.getElementById("confetti-layer");

    function randomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function nonZeroPositive() {
      return randomInt(1, 12);
    }

    function nonZeroNegative() {
      return -randomInt(1, 12);
    }

    function mixedPair() {
      const positive = nonZeroPositive();
      const negative = nonZeroNegative();
      return Math.random() > 0.5 ? [positive, negative] : [negative, positive];
    }

    function makeOperation(level) {
      let first, second, symbol;

      if (level === "1") [first, second, symbol] = [nonZeroPositive(), nonZeroPositive(), "+"];
      if (level === "2") [first, second, symbol] = [nonZeroNegative(), nonZeroNegative(), "+"];
      if (level === "3") [first, second, symbol] = [...mixedPair(), "+"];
      if (level === "4") [first, second, symbol] = [nonZeroPositive(), nonZeroPositive(), "−"];
      if (level === "5") [first, second, symbol] = [nonZeroNegative(), nonZeroNegative(), "−"];
      if (level === "6") [first, second, symbol] = [...mixedPair(), "−"];
      if (level === "challenge-1") return makeOperation(String(randomInt(1, 3)));
      if (level === "challenge-2") return makeOperation(String(randomInt(4, 6)));
      if (level === "challenge-3") return makeOperation(String(randomInt(1, 6)));

      return {
        first,
        second,
        symbol,
        answer: symbol === "+" ? first + second : first - second
      };
    }

    function signedNumber(number) {
      return number >= 0 ? "+" + number : String(number);
    }

    function signedOperand(number) {
      return "(" + signedNumber(number) + ")";
    }

    function operationText() {
      const { first, second, symbol } = currentOperation;
      if (!simplifySigns) {
        return signedOperand(first) + " " + symbol + " " + signedOperand(second);
      }

      const simplifiedSymbol = second < 0
        ? (symbol === "+" ? "−" : "+")
        : symbol;
      return signedNumber(first) + " " + simplifiedSymbol + " " + Math.abs(second);
    }

    function celebrate() {
      clearTimeout(celebrationTimer);
      confettiLayer.classList.remove("is-celebrating");
      requestAnimationFrame(() => {
        confettiLayer.classList.add("is-celebrating");
      });
      celebrationTimer = setTimeout(() => {
        confettiLayer.classList.remove("is-celebrating");
      }, 1450);
    }

    function getScaleBounds() {
      const values = [currentOperation.first, currentOperation.second, currentOperation.answer, 0];
      const minimum = Math.min(...values);
      const maximum = Math.max(...values);
      const span = Math.max(12, maximum - minimum);
      const padding = Math.max(2, Math.ceil(span * 0.2));

      return {
        min: Math.floor((minimum - padding) / 2) * 2,
        max: Math.ceil((maximum + padding) / 2) * 2
      };
    }

    function updateTicks() {
      const ticks = document.getElementById("ticks");
      const bounds = getScaleBounds();
      ticks.replaceChildren();

      const step = 1;
      for (let value = bounds.min; value <= bounds.max; value += step) {
        const bottom = valueToPosition(value);
        const tick = document.createElement("span");
        const label = document.createElement("span");

        tick.className = "tick";
        tick.style.bottom = bottom + "%";
        label.className = "tick-label";
        label.style.bottom = bottom + "%";
        label.textContent = value > 0 ? "+" + value : value;

        ticks.append(tick, label);
      }
    }

    function valueToPosition(value) {
      const bounds = getScaleBounds();
      const bounded = Math.max(bounds.min, Math.min(bounds.max, value));
      return 7 + ((bounded - bounds.min) / (bounds.max - bounds.min)) * 86;
    }

    function updateVisualAid() {
      const start = currentOperation.first;
      const end = visualAnswer;
      const startPosition = valueToPosition(start);
      const endPosition = valueToPosition(end);
      const line = document.getElementById("path-line");
      const startMarker = document.getElementById("start-marker");
      const endMarker = document.getElementById("end-marker");
      const elevator = document.getElementById("elevator-box");

      startMarker.style.bottom = startPosition + "%";
      endMarker.style.bottom = endPosition + "%";
      startMarker.textContent = signedNumber(start);
      endMarker.textContent = signedNumber(end);

      line.style.bottom = Math.min(startPosition, endPosition) + "%";
      line.style.height = Math.max(4, Math.abs(endPosition - startPosition)) + "%";
      document.getElementById("zero-line").style.bottom = valueToPosition(0) + "%";

      elevator.style.bottom = startPosition + "%";
      requestAnimationFrame(() => {
        elevator.style.bottom = endPosition + "%";
      });

      document.getElementById("position-value").textContent = signedNumber(end);
      document.getElementById("distance-value").textContent = Math.abs(end - start);
    }

    function newOperation(options = {}) {
      const clearFeedback = options.clearFeedback !== false;
      if (resetSimplifyToggle.checked) simplifySigns = false;
      currentOperation = makeOperation(activeLevel);
      visualAnswer = currentOperation.first;

      operationDisplay.textContent = signedOperand(currentOperation.first) + " " + currentOperation.symbol + " " + signedOperand(currentOperation.second);
      document.getElementById("simplified-display").textContent = operationText();
      updateAidButtons();

      currentLevelDisplay.textContent = levelNames[activeLevel];
      answerInput.value = "";

      if (clearFeedback) {
        feedback.textContent = "";
        feedback.className = "feedback feedback-neutral";
      }

      updateTicks();
      updateVisualAid();
      answerInput.focus();
    }

    function setActiveLevel(level) {
      activeLevel = level;

      document.querySelectorAll("[data-level]").forEach(button => {
        const selected = button.dataset.level === level;
        button.classList.toggle("is-active", selected);
        button.setAttribute("aria-pressed", String(selected));
      });

      newOperation();
    }

    function updateAidButtons() {
      const signsChoice = document.getElementById("signs-choice");
      signsChoice.classList.toggle("is-active", simplifySigns);
      signsChoice.setAttribute("aria-pressed", String(simplifySigns));
      document.getElementById("simplified-operation").classList.toggle("hidden", !simplifySigns);
    }

    document.querySelectorAll("[data-level]").forEach(button => {
      button.addEventListener("click", () => setActiveLevel(button.dataset.level));
    });

    document.getElementById("answer-form").addEventListener("submit", event => {
      event.preventDefault();

      if (answerInput.value.trim() === "") {
        feedback.textContent = "Escriu un resultat abans de comprovar.";
        feedback.className = "feedback feedback-wrong";
        answerInput.focus();
        return;
      }

      const givenAnswer = Number(answerInput.value);

      if (givenAnswer === currentOperation.answer) {
        score += 1;
        streak += 1;
        scoreValue.textContent = score;
        streakValue.textContent = streak;
        feedback.textContent = "Molt bé! Has encertat el resultat.";
        feedback.className = "feedback feedback-correct";
        celebrate();
        newOperation({ clearFeedback: false });
      } else {
        streak = 0;
        streakValue.textContent = streak;
        feedback.textContent = "Encara no. Representa el moviment a l'ajuda visual i torna-ho a provar.";
        feedback.className = "feedback feedback-wrong";
      }
    });

    document.getElementById("new-operation-button").addEventListener("click", () => newOperation());

    const scale = document.getElementById("scale");
    const endMarker = document.getElementById("end-marker");
    const autoCopyToggle = document.getElementById("auto-copy-toggle");
    const copyDistanceButton = document.getElementById("copy-distance-button");
    let draggingMarker = false;

    copyDistanceButton.addEventListener("click", () => {
      answerInput.value = visualAnswer;
      answerInput.focus();
    });

    autoCopyToggle.addEventListener("change", () => {
      copyDistanceButton.classList.toggle("hidden", autoCopyToggle.checked);
    });

    document.getElementById("signs-choice").addEventListener("click", () => {
      simplifySigns = !simplifySigns;
      updateAidButtons();
      document.getElementById("simplified-display").textContent = operationText();
    });

    function markerValueFromPointer(event) {
      const bounds = getScaleBounds();
      const rect = scale.getBoundingClientRect();
      const ratio = 1 - ((event.clientY - rect.top) / rect.height);
      const raw = bounds.min + ratio * (bounds.max - bounds.min);
      return Math.round(Math.max(bounds.min, Math.min(bounds.max, raw)));
    }

    endMarker.addEventListener("pointerdown", event => {
      draggingMarker = true;
      endMarker.setPointerCapture?.(event.pointerId);
      endMarker.style.cursor = "grabbing";
      event.preventDefault();
    });

    endMarker.addEventListener("pointermove", event => {
      if (!draggingMarker) return;
      visualAnswer = markerValueFromPointer(event);
      if (autoCopyToggle.checked) answerInput.value = visualAnswer;
      updateVisualAid();
    });

    function stopDragging(event) {
      if (!draggingMarker) return;
      draggingMarker = false;
      endMarker.releasePointerCapture?.(event.pointerId);
      endMarker.style.cursor = "grab";
    }

    endMarker.addEventListener("pointerup", stopDragging);
    endMarker.addEventListener("pointercancel", stopDragging);
    endMarker.style.cursor = "grab";

    updateAidButtons();
    setActiveLevel("1");
  </script>
 </body>
</html>
